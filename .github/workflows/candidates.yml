name: Collect reindeer photo candidates
on: workflow_dispatch
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/candidates.py
      - name: Contact sheets
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null
          cd candidates
          ls [0-9]*.jpg > /dev/null
          montage -label '%t' [0-9]*.jpg -tile 6x5 -geometry 300x200+4+4 -pointsize 22 sheet-%02d.jpg
          ls
      - name: Commit to the candidates branch
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout -B candidates
          git add candidates; git commit -qm "Reindeer photo candidates"; git push -f origin candidates
